<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>PLACER</title>
  <!-- A solid tile so the mark holds its shape against light and dark tab bars.
       The P is drawn as a path rather than text: a favicon cannot rely on a
       webfont being loaded, and Archivo Expanded would not be. Its bowl and
       counter are kept generous so the letter still reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M10.5 6.5h5a5.75 5.75 0 0 1 0 11.5v7.5h-5V6.5Zm5 3a2.75 2.75 0 0 1 0 5.5V9.5Z"/>
</svg>
