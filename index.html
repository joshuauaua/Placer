<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The bench, white on black. The SVG is for browsers that take one; the
         PNGs, rendered from it, for those that do not and for home screens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PLACER is a toolkit for participatory placemaking, helping communities visualize and propose improvements to their public spaces." />
    <title>Placer</title>
    <!-- Link previews (Slack, iMessage, social). Crawlers do not run the app,
         so these must be in the static HTML, with an absolute image URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLACER" />
    <meta property="og:url" content="https://plcr.org/" />
    <meta property="og:title" content="PLACER" />
    <meta property="og:description" content="A toolkit for participatory placemaking." />
    <meta property="og:image" content="https://plcr.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PLACER, a toolkit for participatory placemaking, framed by line drawings of street furniture." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
