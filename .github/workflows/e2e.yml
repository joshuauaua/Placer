# End-to-end tests. The suite builds the app with `-m e2e` and drives it in
# Chromium; .env.e2e is the whole environment, so this needs no secrets and makes
# no outbound requests (see e2e/fixtures/app.js).
name: E2E

on:
  pull_request:
  push:
    branches: [Development]
  workflow_dispatch:

# A newer push to the same branch makes the run in flight pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ci, not install: the lockfile is the contract, and scripts/check-deps.mjs
      # fails the build if node_modules ever drifts from it.
      - name: Install dependencies
        run: npm ci

      # Browsers are ~100 MB fresh, so they are cached against the Playwright
      # version that asked for them — a bump invalidates the key on its own.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs the host libraries it links against, which
      # live outside the cached directory.
      - name: Install system libraries for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.js builds the app and starts the preview server itself.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
